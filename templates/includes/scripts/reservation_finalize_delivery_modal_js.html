<script>
(function () {
  const reservationId = '{{ reservation.id }}';

  function normalizeDigits(value) {
    const persianDigits = '۰۱۲۳۴۵۶۷۸۹';
    const englishDigits = '0123456789';
    let normalized = value.toString();
    for (let i = 0; i < 10; i++) {
      normalized = normalized.replace(new RegExp(persianDigits[i], 'g'), englishDigits[i]);
    }
    normalized = normalized.replace(/,/g, '').replace(/[^\d]/g, '');
    return parseInt(normalized) || 0;
  }

  function formatCurrency(value) {
    if (!value && value !== 0) return '';
    const numericValue = normalizeDigits(value.toString());
    const num = parseInt(numericValue, 10) || 0;
    return num.toLocaleString('fa-IR');
  }

  function showToast(type, message) {
    let toastContainer = document.getElementById('toastContainer');
    if (!toastContainer) {
      toastContainer = document.createElement('div');
      toastContainer.id = 'toastContainer';
      toastContainer.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 9999; width: 300px;';
      document.body.appendChild(toastContainer);
    }

    const toastId = 'toast_' + Date.now();
    const bgClass = type === 'success' ? 'bg-success' : 'bg-danger';
    const toastHtml = '' +
      '<div id="' + toastId + '" class="toast show" role="alert" aria-live="assertive">' +
        '<div class="toast-header ' + bgClass + ' text-white">' +
          '<strong class="me-auto">' +
            (type === 'success' ? '✓ موفق' : '✕ خطا') +
          '</strong>' +
          '<button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>' +
        '</div>' +
        '<div class="toast-body">' +
          message +
        '</div>' +
      '</div>';

    toastContainer.insertAdjacentHTML('beforeend', toastHtml);
    setTimeout(function () {
      const toastEl = document.getElementById(toastId);
      if (toastEl) toastEl.remove();
    }, 4000);
  }

  let hasEventListenersAttached = false;

  function cleanupModalBackdrop() {
    document.querySelectorAll('.modal-backdrop').forEach(function (backdrop) {
      backdrop.remove();
    });

    document.querySelectorAll('.modal').forEach(function (modalEl) {
      modalEl.classList.remove('show');
      modalEl.style.display = 'none';
      modalEl.setAttribute('aria-hidden', 'true');
      modalEl.removeAttribute('aria-modal');
    });

    document.body.classList.remove('modal-open');
    document.body.style.removeProperty('overflow');
    document.body.style.removeProperty('padding-right');
    document.body.style.removeProperty('margin-right');

    const html = document.querySelector('html');
    if (html) {
      html.classList.remove('modal-open');
      html.style.removeProperty('overflow');
      html.style.removeProperty('padding-right');
      html.style.removeProperty('margin-right');
    }
  }

  function hideModalById(modalId) {
    const modalEl = document.getElementById(modalId);
    if (!modalEl) return;

    let modal = bootstrap.Modal.getInstance(modalEl);
    if (!modal) {
      modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    }

    modal.hide();
    modal.dispose();
    setTimeout(function () {
      cleanupModalBackdrop();
    }, 300);
  }

  function showModalById(modalId) {
    const modalEl = document.getElementById(modalId);
    if (!modalEl) return;

    cleanupModalBackdrop();
    setTimeout(function () {
      const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
      modal.show();
    }, 50);
  }

  function validateGuaranteeForm() {
    const form = document.getElementById('guaranteeForm' + reservationId);
    const errorsDiv = document.getElementById('guaranteeFormErrors' + reservationId);
    if (!form) return false;

    form.querySelectorAll('.invalid-feedback').forEach(function (el) {
      el.style.display = 'none';
    });
    errorsDiv.style.display = 'none';
    errorsDiv.innerHTML = '';
    form.classList.remove('was-validated');

    const g1Type = form.querySelector('select[name="guarantee1_type"]').value;
    const g1Code = form.querySelector('input[name="guarantee1_tracking_code"]').value;
    const g1Payee = (form.querySelector('input[name="guarantee1_payee"]').value || '').trim();
    const g2Type = (form.querySelector('select[name="guarantee2_type"]').value || '').trim();
    const g2Code = form.querySelector('input[name="guarantee2_tracking_code"]').value;
    const g2Payee = (form.querySelector('input[name="guarantee2_payee"]').value || '').trim();

    const errors = [];

    if (!g1Type) {
      errors.push('نوع ضمانت اول الزامی است.');
      const feedback = form.querySelector('select[name="guarantee1_type"]').closest('.col-sm-9').querySelector('.invalid-feedback');
      if (feedback) feedback.style.display = 'block';
    }

    if (!g1Code || g1Code.trim().toLowerCase() === 'n/a') {
      errors.push('کد رهگیری ضمانت اول الزامی است.');
      const feedback = form.querySelector('input[name="guarantee1_tracking_code"]').closest('.col-sm-9').querySelector('.invalid-feedback');
      if (feedback) feedback.style.display = 'block';
    }

    if (g1Type === 'CHECK' && !g1Payee) {
      errors.push('فیلد «در وجه» برای ضمانت اول با نوع چک الزامی است.');
      const feedback = form.querySelector('input[name="guarantee1_payee"]').closest('.col-sm-9').querySelector('.invalid-feedback');
      if (feedback) feedback.style.display = 'block';
    }

    if (g2Type && (!g2Code || g2Code.trim().toLowerCase() === 'n/a')) {
      errors.push('اگر ضمانت دوم انتخاب شد، کد رهگیری آن الزامی است.');
      const feedback = form.querySelector('input[name="guarantee2_tracking_code"]').closest('.col-sm-9').querySelector('.invalid-feedback');
      if (feedback) feedback.style.display = 'block';
    }

    if (g2Type === 'CHECK' && !g2Payee) {
      errors.push('فیلد «در وجه» برای ضمانت دوم با نوع چک الزامی است.');
      const feedback = form.querySelector('input[name="guarantee2_payee"]').closest('.col-sm-9').querySelector('.invalid-feedback');
      if (feedback) feedback.style.display = 'block';
    }

    if (g2Code && !g2Type) {
      errors.push('اگر کد رهگیری ضمانت دوم وارد شد، نوع آن الزامی است.');
    }

    if (errors.length > 0) {
      errorsDiv.innerHTML = '<strong>خطاهای اعتبارسنجی:</strong><ul style="margin: 0.5rem 0 0;"><li>' + errors.join('</li><li>') + '</li></ul>';
      errorsDiv.style.display = 'block';
      form.classList.add('was-validated');
      return false;
    }

    return { g1Type, g1Code, g1Payee, g2Type, g2Code, g2Payee };
  }

  const guaranteeNextBtn = document.getElementById('guaranteeNextBtn' + reservationId);
  if (guaranteeNextBtn) {
    guaranteeNextBtn.addEventListener('click', function () {
      const validated = validateGuaranteeForm();
      if (!validated) return;

      const form = document.getElementById('guaranteeForm' + reservationId);
      document.getElementById('hiddenGuarantee1Type' + reservationId).value = validated.g1Type;
      document.getElementById('hiddenGuarantee1Code' + reservationId).value = validated.g1Code;
      document.getElementById('hiddenGuarantee1Payee' + reservationId).value = validated.g1Payee;
      document.getElementById('hiddenGuarantee2Type' + reservationId).value = validated.g2Type;
      document.getElementById('hiddenGuarantee2Code' + reservationId).value = validated.g2Code;
      document.getElementById('hiddenGuarantee2Payee' + reservationId).value = validated.g2Payee;

      hideModalById('finalizeDeliveryGuaranteeModal' + reservationId);

      setTimeout(function () {
        showModalById('finalizeDeliveryModal' + reservationId);
        formatAllCurrencies();
        syncInitialVisibility();
        if (!hasEventListenersAttached) {
          attachFinalizationEventListeners();
          hasEventListenersAttached = true;
        }
      }, 300);
    });
  }

  const backToGuaranteeBtn = document.getElementById('backToGuaranteeBtn' + reservationId);
  if (backToGuaranteeBtn) {
    backToGuaranteeBtn.addEventListener('click', function () {
      hideModalById('finalizeDeliveryModal' + reservationId);

      setTimeout(function () {
        showModalById('finalizeDeliveryGuaranteeModal' + reservationId);
      }, 300);
    });
  }

  const form = document.getElementById('finalizeDeliveryForm' + reservationId);
  const finalizationUrl = form ? form.getAttribute('data-finalization-url') : '';

  function attachFinalizationEventListeners() {
    if (hasEventListenersAttached) return;

    const toggleBtn = document.getElementById('toggleAdditionalFeeForm' + reservationId);
    const formContainer = document.getElementById('additionalFeeFormContainer' + reservationId);
    const submitFeeBtn = document.getElementById('submitFeeBtn' + reservationId);
    const cancelFeeBtn = document.getElementById('cancelFeeBtn' + reservationId);
    const containerElement = document.getElementById('additionalFeesContainer' + reservationId);
    const feeSummary = document.getElementById('feeSummary' + reservationId);

    if (toggleBtn && formContainer && !toggleBtn._clickListenerAttached) {
      toggleBtn._clickListenerAttached = true;
      toggleBtn.addEventListener('click', function () {
        formContainer.style.display = formContainer.style.display === 'none' ? 'block' : 'none';
        if (formContainer.style.display === 'block') {
          const titleInput = formContainer.querySelector('.fee-title-input');
          if (titleInput) titleInput.focus();
        }
      });
    }

    if (cancelFeeBtn && formContainer && !cancelFeeBtn._clickListenerAttached) {
      cancelFeeBtn._clickListenerAttached = true;
      cancelFeeBtn.addEventListener('click', function () {
        formContainer.style.display = 'none';
        formContainer.querySelector('.fee-title-input').value = '';
        formContainer.querySelector('.fee-amount-input').value = '';
        formContainer.querySelector('.fee-notes-input').value = '';
      });
    }

    if (containerElement) {
      containerElement.addEventListener('click', function (event) {
        const deleteBtn = event.target.closest('.fee-delete-btn');
        if (!deleteBtn) return;

        const feeId = deleteBtn.getAttribute('data-fee-id');
        if (!feeId) return;

        const csrfTokenInput = form ? form.querySelector('input[name="csrfmiddlewaretoken"]') : null;
        const formData = new FormData();
        formData.append('csrfmiddlewaretoken', csrfTokenInput ? csrfTokenInput.value : '');
        formData.append('action', 'delete_fee');
        formData.append('fee_id', feeId);

        fetch(finalizationUrl || (form ? form.action : window.location.href), {
          method: 'POST',
          headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': csrfTokenInput ? csrfTokenInput.value : '' },
          body: formData
        })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          if (data.success) {
            const feeItem = containerElement.querySelector('.fee-item[data-fee-id="' + feeId + '"]');
            if (feeItem) feeItem.remove();
            updateFinancialSummary(data.total_fees, data.new_remaining);
            const remainingFeeItems = containerElement.querySelectorAll('.fee-item');
            if (remainingFeeItems.length === 0) {
              const emptyState = document.createElement('div');
              emptyState.className = 'alert alert-light mb-0 text-center';
              emptyState.innerHTML = '<span class="text-muted">هنوز هزینه جانبی ثبت نشده است</span>';
              containerElement.innerHTML = '';
              containerElement.appendChild(emptyState);
            }
            showToast('success', data.message);
          } else {
            showToast('error', data.message || 'حذف هزینه جانبی با خطا مواجه شد');
          }
        });
      });
    }

    if (submitFeeBtn && formContainer) {
      submitFeeBtn.addEventListener('click', function () {
        const titleInput = formContainer.querySelector('.fee-title-input');
        const amountInput = formContainer.querySelector('.fee-amount-input');
        const notesInput = formContainer.querySelector('.fee-notes-input');
        const csrfTokenInput = form ? form.querySelector('input[name="csrfmiddlewaretoken"]') : null;

        if (!titleInput.value.trim()) {
          showToast('error', 'لطفاً عنوان هزینه را وارد کنید');
          return;
        }

        if (!amountInput.value.trim()) {
          showToast('error', 'لطفاً مبلغ هزینه را وارد کنید');
          return;
        }

        const normalizedAmount = normalizeDigits(amountInput.value);
        const formData = new FormData();
        formData.append('csrfmiddlewaretoken', csrfTokenInput ? csrfTokenInput.value : '');
        formData.append('action', 'add_fee');
        formData.append('title', titleInput.value.trim());
        formData.append('amount', normalizedAmount);
        formData.append('notes', notesInput.value.trim());

        fetch(finalizationUrl, {
          method: 'POST',
          headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-CSRFToken': csrfTokenInput ? csrfTokenInput.value : '' },
          body: formData
        })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          if (data.success) {
            showToast('success', data.message);

            const feeHtml = '' +
              '<div class="alert alert-info mb-2 d-flex justify-content-between align-items-center fee-item" data-fee-id="' + data.fee_id + '">' +
                '<div class="flex-grow-1">' +
                  '<strong>' + data.fee_title + '</strong>' +
                '</div>' +
                '<div class="d-flex align-items-center gap-2 text-nowrap ms-2">' +
                  '<strong>' + formatCurrency(data.fee_amount) + ' تومان</strong>' +
                  '<button type="button" class="btn btn-sm btn-outline-danger fee-delete-btn" data-action="delete-fee" data-fee-id="' + data.fee_id + '" aria-label="حذف هزینه">×</button>' +
                '</div>' +
              '</div>';

            const noFeesAlert = containerElement.querySelector('.alert-light');
            if (noFeesAlert) noFeesAlert.remove();

            containerElement.insertAdjacentHTML('beforeend', feeHtml);
            updateFinancialSummary(data.total_fees, data.new_remaining);
            feeSummary.style.display = 'block';

            titleInput.value = '';
            amountInput.value = '';
            notesInput.value = '';
            formContainer.style.display = 'none';
          } else {
            showToast('error', data.message || 'خطایی در ثبت هزینه رخ داد');
          }
        });
      });
    }

    if (form && !form._submitListenerAttached) {
      form._submitListenerAttached = true;
      form.addEventListener('submit', function (e) {
        e.preventDefault();

        const paymentAmountInput = form.querySelector('input[name="remaining_payment_amount"]');
        const paymentMethodSelect = form.querySelector('select[name="remaining_payment_method"]');
        const paymentCodeInput = form.querySelector('input[name="remaining_payment_tracking_code"]');

        if (!paymentAmountInput) {
          showToast('error', 'فیلد مبلغ پرداخت یافت نشد');
          return;
        }

        const requiredPaymentAmount = document.getElementById('requiredPaymentAmount' + reservationId);
        const requiredAmount = requiredPaymentAmount ? normalizeDigits(requiredPaymentAmount.textContent) : 0;

        if (paymentAmountInput.value) {
          const normalized = normalizeDigits(paymentAmountInput.value);
          paymentAmountInput.value = normalized;
        }

        if (requiredAmount > 0) {
          if (!paymentAmountInput.value || normalizeDigits(paymentAmountInput.value) === 0) {
            showToast('error', 'لطفاً مبلغ پرداخت را وارد کنید');
            return;
          }
          if (!paymentMethodSelect || !paymentMethodSelect.value) {
            showToast('error', 'لطفاً روش پرداخت را انتخاب کنید');
            return;
          }
          if (!paymentCodeInput || !paymentCodeInput.value.trim()) {
            showToast('error', 'لطفاً کد رهگیری پرداخت را وارد کنید');
            return;
          }
        }

        const submitButton = form.querySelector('button[type="submit"]');
        if (submitButton && submitButton.disabled) {
          return;
        }

        if (submitButton) {
          submitButton.disabled = true;
          submitButton.classList.add('disabled');
          submitButton.innerHTML = '<span class="spinner-border spinner-border-sm ms-2" role="status" aria-hidden="true"></span>در حال پردازش...';
        }

        const formData = new FormData(form);

        fetch(finalizationUrl, {
          method: 'POST',
          body: formData
        })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          if (data.success) {
            showToast('success', data.message);
            const modalElement = document.getElementById('finalizeDeliveryModal' + reservationId);
            if (modalElement) {
              hideModalById('finalizeDeliveryModal' + reservationId);
            }
            setTimeout(function () {
              window.location.reload();
            }, 1200);
          } else {
            showToast('error', data.message || 'خطایی رخ داد');
            if (submitButton) {
              submitButton.disabled = false;
              submitButton.classList.remove('disabled');
              submitButton.innerHTML = '<i class="fi fi-rr-check ms-1"></i>تأیید تحویل لباس';
            }
          }
        })
        .catch(function (error) {
          console.error('Fetch error:', error);
          showToast('error', 'خطا در ارتباط با سرور');
          if (submitButton) {
            submitButton.disabled = false;
            submitButton.classList.remove('disabled');
            submitButton.innerHTML = '<i class="fi fi-rr-check ms-1"></i>تأیید تحویل لباس';
          }
        });
      });
    }

    hasEventListenersAttached = true;
  }

  function formatAllCurrencies() {
    const baseRemaining = document.getElementById('baseRemainingAmount' + reservationId);
    if (baseRemaining && baseRemaining.textContent) {
      const text = baseRemaining.textContent.replace('تومان', '').trim();
      baseRemaining.textContent = formatCurrency(text) + ' تومان';
    }

    const finalRemaining = document.getElementById('finalRemainingAmount' + reservationId);
    if (finalRemaining && finalRemaining.textContent) {
      const text = finalRemaining.textContent.replace('تومان', '').trim();
      finalRemaining.textContent = formatCurrency(text) + ' تومان';
    }

    const paymentAmount = document.getElementById('paymentAmount' + reservationId);
    if (paymentAmount && paymentAmount.value) {
      paymentAmount.value = formatCurrency(paymentAmount.value);
    }
  }

  function syncInitialVisibility() {
    const requiredPaymentAmount = document.getElementById('requiredPaymentAmount' + reservationId);
    const initialRemaining = requiredPaymentAmount ? normalizeDigits(requiredPaymentAmount.textContent) : 0;

    const paymentSection = document.getElementById('paymentSection' + reservationId);
    const settledNotice = document.getElementById('settledNotice' + reservationId);
    const feeSummary = document.getElementById('feeSummary' + reservationId);
    const containerElement = document.getElementById('additionalFeesContainer' + reservationId);

    if (paymentSection) {
      paymentSection.style.display = initialRemaining > 0 ? 'block' : 'none';
    }
    if (settledNotice) {
      settledNotice.style.display = initialRemaining > 0 ? 'none' : 'block';
    }
    if (feeSummary && containerElement) {
      feeSummary.style.display = containerElement.querySelector('.fee-item') ? 'block' : 'none';
    }
  }

  formatAllCurrencies();
  syncInitialVisibility();

  ['finalizeDeliveryGuaranteeModal' + reservationId, 'finalizeDeliveryModal' + reservationId].forEach(function (modalId) {
    const modalEl = document.getElementById(modalId);
    if (modalEl) {
      modalEl.addEventListener('hidden.bs.modal', function () {
        setTimeout(cleanupModalBackdrop, 50);
      });
    }
  });

  const guarantee1Select = document.querySelector('#guaranteeForm' + reservationId + ' select[name="guarantee1_type"]');
  const guarantee2Select = document.querySelector('#guaranteeForm' + reservationId + ' select[name="guarantee2_type"]');

  function updateGuaranteePayee(select, requiredSpan) {
    if (!select) return;
    const isCheck = select.value === 'CHECK';
    if (requiredSpan) {
      requiredSpan.style.display = isCheck ? 'inline' : 'none';
    }
  }

  if (guarantee1Select) {
    const requiredSpan = document.querySelector('#guaranteeForm' + reservationId + ' .guarantee1-payee-required');
    updateGuaranteePayee(guarantee1Select, requiredSpan);
    guarantee1Select.addEventListener('change', function () {
      updateGuaranteePayee(this, requiredSpan);
    });
  }

  if (guarantee2Select) {
    const requiredSpan = document.querySelector('#guaranteeForm' + reservationId + ' .guarantee2-payee-required');
    updateGuaranteePayee(guarantee2Select, requiredSpan);
    guarantee2Select.addEventListener('change', function () {
      updateGuaranteePayee(this, requiredSpan);
    });
  }

  attachFinalizationEventListeners();

  function updateFinancialSummary(totalFees, newRemaining) {
    const totalFeesElem = document.getElementById('totalFeesAmount' + reservationId);
    if (totalFeesElem) {
      totalFeesElem.textContent = formatCurrency(totalFees) + ' تومان';
    }

    const finalRemainingElem = document.getElementById('finalRemainingAmount' + reservationId);
    if (finalRemainingElem) {
      finalRemainingElem.textContent = formatCurrency(newRemaining) + ' تومان';
    }

    const paymentSection = document.getElementById('paymentSection' + reservationId);
    const settledNotice = document.getElementById('settledNotice' + reservationId);

    if (paymentSection) {
      paymentSection.style.display = newRemaining > 0 ? 'block' : 'none';
    }
    if (settledNotice) {
      settledNotice.style.display = newRemaining > 0 ? 'none' : 'block';
    }

    const paymentAmountInput = document.getElementById('paymentAmount' + reservationId);
    if (paymentAmountInput) {
      paymentAmountInput.value = formatCurrency(newRemaining);
    }

    const requiredPaymentAmountElem = document.getElementById('requiredPaymentAmount' + reservationId);
    if (requiredPaymentAmountElem) {
      requiredPaymentAmountElem.textContent = formatCurrency(newRemaining) + ' تومان';
    }

    const alertRemainingAmountElem = document.getElementById('alertRemainingAmount' + reservationId);
    if (alertRemainingAmountElem) {
      alertRemainingAmountElem.textContent = formatCurrency(newRemaining) + ' تومان';
    }
  }

  attachFinalizationEventListeners();
})();
</script>
