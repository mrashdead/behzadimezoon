<script>
(function () {
  if (window.__stagedPaymentsSetupDone) {
    return;
  }
  window.__stagedPaymentsSetupDone = true;

  var PERSIAN_ORDINALS = [
    'اول', 'دوم', 'سوم', 'چهارم', 'پنجم', 'ششم', 'هفتم', 'هشتم', 'نهم', 'دهم',
    'یازدهم', 'دوازدهم', 'سیزدهم', 'چهاردهم', 'پانزدهم', 'شانزدهم', 'هفدهم',
    'هجدهم', 'نوزدهم', 'بیستم'
  ];

  var TYPE_LABELS = {
    DEPOSIT: 'بیعانه',
    PARTIAL_PAYMENT: 'پرداخت تکمیلی',
    FINAL_PAYMENT: 'پرداخت نهایی'
  };

  function toInt(value) {
    if (value === null || value === undefined) return 0;
    var text = String(value)
      .replace(/[۰-۹]/g, function (d) { return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); })
      .replace(/[٠-٩]/g, function (d) { return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)); })
      .replace(/[,\u066C\u066B\u200c\u202f\s]/g, '');
    var parsed = parseInt(text, 10);
    return isNaN(parsed) ? 0 : parsed;
  }

  function formatMoney(value) {
    var num = toInt(value);
    return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function ordinal(index) {
    if (index >= 1 && index <= PERSIAN_ORDINALS.length) {
      return PERSIAN_ORDINALS[index - 1];
    }
    return String(index);
  }

  function getContainer(form) {
    return form.querySelector('.js-staged-payments');
  }

  function getRows(container) {
    return Array.prototype.slice.call(container.querySelectorAll('.js-payment-rows .js-payment-row'));
  }

  function totalFormsInput(container) {
    var prefix = container.dataset.prefix;
    return container.querySelector('input[name="' + prefix + '-TOTAL_FORMS"]');
  }

  function rowIsDeleted(row) {
    var box = row.querySelector('input[type="checkbox"][name$="-DELETE"]');
    return !!(box && box.checked);
  }

  function updateLabels(container) {
    var counters = {};
    getRows(container).forEach(function (row) {
      var typeSelect = row.querySelector('select.js-payment-type');
      var label = row.querySelector('.js-payment-stage-label');
      if (!label) return;
      if (rowIsDeleted(row)) {
        label.className = 'badge bg-danger-subtle text-danger js-payment-stage-label';
        label.textContent = 'حذف خواهد شد';
        return;
      }
      var type = typeSelect ? typeSelect.value : 'DEPOSIT';
      counters[type] = (counters[type] || 0) + 1;
      var base = TYPE_LABELS[type] || 'پرداخت';
      var text = base;
      if (type !== 'FINAL_PAYMENT' || counters[type] > 1) {
        text = base + ' ' + ordinal(counters[type]);
      }
      label.className = 'badge bg-primary-subtle text-primary js-payment-stage-label';
      label.textContent = text;
    });
  }

  function updateTotals(container) {
    var form = container.closest('form');
    if (!form) return;

    var totalPrice = toInt(container.dataset.totalPrice);
    var totalPaid = 0;

    getRows(container).forEach(function (row) {
      if (rowIsDeleted(row)) return;
      var amountInput = row.querySelector('.js-payment-amount');
      totalPaid += toInt(amountInput ? amountInput.value : 0);
    });

    var remaining = totalPrice - totalPaid;
    var settlementLabel = 'تسویه کامل';
    var remainingDisplay = 0;
    var overpaid = 0;

    if (remaining > 0) {
      settlementLabel = 'دارای بدهی';
      remainingDisplay = remaining;
    } else if (remaining < 0) {
      settlementLabel = 'اضافه‌پرداخت';
      overpaid = -remaining;
    }

    var totalPaidEl = form.querySelector('.js-total-paid');
    var remainingEl = form.querySelector('.js-remaining-amount');
    var settlementEl = form.querySelector('.js-settlement-status');
    var overpaidEl = form.querySelector('.js-overpaid-amount');

    if (totalPaidEl) totalPaidEl.value = formatMoney(totalPaid);
    if (remainingEl) remainingEl.value = formatMoney(remainingDisplay);
    if (settlementEl) settlementEl.value = settlementLabel;
    if (overpaidEl) overpaidEl.value = formatMoney(overpaid);

    var emptyNote = container.querySelector('.js-payment-empty');
    if (emptyNote) {
      emptyNote.classList.toggle('d-none', getRows(container).length > 0);
    }
  }

  function initRowDatePickers(row) {
    if (window.UIHelpers && typeof window.UIHelpers.initPersianDatepickers === 'function') {
      window.UIHelpers.initPersianDatepickers();
    }
  }

  function addRow(container) {
    var template = container.querySelector('.js-payment-template');
    var rowsWrapper = container.querySelector('.js-payment-rows');
    var totalInput = totalFormsInput(container);
    if (!template || !rowsWrapper || !totalInput) return;

    var index = parseInt(totalInput.value, 10);
    if (isNaN(index)) index = 0;

    var html = template.innerHTML.replace(/__prefix__/g, String(index));
    var holder = document.createElement('div');
    holder.innerHTML = html.trim();
    var newRow = holder.firstElementChild;
    if (!newRow) return;

    newRow.dataset.index = String(index);
    rowsWrapper.appendChild(newRow);
    totalInput.value = String(index + 1);

    // پیش‌فرض روش پرداخت: همان روش پیش‌فرض رزرو
    var form = container.closest('form');
    var defaultMethod = form ? form.querySelector('select[name="payment_method"]') : null;
    var methodSelect = newRow.querySelector('select.js-payment-method');
    if (defaultMethod && methodSelect && !methodSelect.value) {
      methodSelect.value = defaultMethod.value;
    }

    initRowDatePickers(newRow);
    updateLabels(container);
    updateTotals(container);

    var amountInput = newRow.querySelector('.js-payment-amount');
    if (amountInput) {
      amountInput.focus();
    }
  }

  function removeRow(container, row) {
    var idInput = row.querySelector('input.js-payment-id');
    var hasId = idInput && idInput.value && idInput.value !== '';

    if (hasId) {
      // ردیف ذخیره‌شده: علامت حذف می‌خورد تا سابقه حفظ شود و اندیس‌ها خراب نشوند
      var deleteBox = row.querySelector('input[type="checkbox"][name$="-DELETE"]');
      if (deleteBox) {
        deleteBox.checked = true;
      }
      row.classList.add('opacity-50');
      // فقط فیلدهای داده غیرفعال می‌شوند؛ id و DELETE باید ارسال شوند
      row.querySelectorAll(
        '.js-payment-amount, .js-payment-type, .js-payment-date, ' +
        '.js-payment-due-date, .js-payment-method, .js-payment-reference, .js-payment-description'
      ).forEach(function (el) {
        el.disabled = true;
      });
    } else {
      // ردیف جدید: از DOM حذف می‌شود (اندیس خالی توسط فرم‌ست نادیده گرفته می‌شود)
      row.remove();
    }

    updateLabels(container);
    updateTotals(container);
  }

  // -------------------- رویدادها (Delegate) --------------------
  document.addEventListener('click', function (event) {
    var addButton = event.target.closest('.js-add-payment');
    if (addButton) {
      var container = addButton.closest('.js-staged-payments');
      if (container) {
        event.preventDefault();
        addRow(container);
      }
      return;
    }

    var removeButton = event.target.closest('.js-remove-payment');
    if (removeButton) {
      var row = removeButton.closest('.js-payment-row');
      var rowContainer = removeButton.closest('.js-staged-payments');
      if (row && rowContainer) {
        event.preventDefault();
        removeRow(rowContainer, row);
      }
    }
  });

  document.addEventListener('input', function (event) {
    if (event.target.classList && event.target.classList.contains('js-payment-amount')) {
      // قالب‌بندی نمایشی؛ پاک‌سازی نهایی هنگام ارسال انجام می‌شود
      var raw = event.target.value.replace(/,/g, '');
      if (/^\d*$/.test(raw) && raw !== '') {
        event.target.value = formatMoney(raw);
      }
      var container = event.target.closest('.js-staged-payments');
      if (container) updateTotals(container);
    }
  });

  document.addEventListener('change', function (event) {
    var container = event.target.closest ? event.target.closest('.js-staged-payments') : null;
    if (container && (event.target.classList.contains('js-payment-type'))) {
      updateLabels(container);
      updateTotals(container);
    }
  });

  document.addEventListener('shown.bs.modal', function (event) {
    if (!event.target || !event.target.id) return;
    if (event.target.id.indexOf('editReservationModal') !== 0) return;

    var form = event.target.querySelector('form');
    if (!form) return;
    var container = getContainer(form);
    if (container) {
      updateLabels(container);
      updateTotals(container);
    }

    // اطمینان از قالب‌بندی و تاریخ‌گزین برای ردیف‌های موجود
    if (window.UIHelpers) {
      if (typeof window.UIHelpers.initPersianDatepickers === 'function') {
        window.UIHelpers.initPersianDatepickers();
      }
      if (typeof window.UIHelpers.initMoneyInputs === 'function') {
        window.UIHelpers.initMoneyInputs();
      }
    }
  });

  // -------------------- ضمانت‌ها (رفتار قبلی، محدود به همان فرم) --------------------
  function updateGuaranteeRequirement(form) {
    [1, 2].forEach(function (n) {
      var select = form.querySelector('select[name="guarantee' + n + '_type"]');
      var input = form.querySelector('input[name="guarantee' + n + '_payee"]');
      var requiredIcon = form.querySelector('[id*="guarantee' + n + 'PayeeRequired"]');
      if (!select || !input) return;

      var isCheck = select.value === 'CHECK';
      input.required = isCheck;
      if (requiredIcon) {
        requiredIcon.style.display = isCheck ? 'inline' : 'none';
      }
      if (!isCheck) {
        input.value = '';
        input.classList.remove('is-invalid');
      }
    });
  }

  document.addEventListener('change', function (event) {
    if (!event.target.name) return;
    if (event.target.name.indexOf('guarantee') !== 0) return;
    var form = event.target.closest('form');
    if (form) updateGuaranteeRequirement(form);
  });

  function setupAllGuaranteeForms() {
    document.querySelectorAll('form[id^="reservationEditForm"]').forEach(function (form) {
      updateGuaranteeRequirement(form);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupAllGuaranteeForms);
  } else {
    setupAllGuaranteeForms();
  }

  document.addEventListener('shown.bs.modal', function (event) {
    if (event.target && event.target.id && event.target.id.indexOf('editReservationModal') === 0) {
      var form = event.target.querySelector('form');
      if (form) updateGuaranteeRequirement(form);
    }
  });

  // -------------------- بررسی در‌لحظه‌ای موجودی (تاریخ / مدت اجاره / لباس) --------------------
  // وقتی کاربر در «ویرایش رزرو» تاریخ شروع، مدت اجاره یا لباس را عوض می‌کند،
  // بدون ذخیره‌کردن به سرور می‌زنیم و می‌گوییم لباس در آن بازه آزاد است یا نه.
  // رزرو جاری با ``exclude_reservation_id`` از بررسی تداخل کنار گذاشته می‌شود.
  var AVAILABILITY_URL = '/reservations/check-availability/';
  var availabilityTimers = {};

  function normalizeDateInput(value) {
    var text = String(value || '').trim();
    if (!text) return '';
    if (window.UIHelpers && typeof window.UIHelpers.normalizeDigits === 'function') {
      text = window.UIHelpers.normalizeDigits(text);
    }
    return text.replace(/-/g, '/');
  }

  function readNumber(value) {
    var text = String(value === null || value === undefined ? '' : value);
    if (window.UIHelpers && typeof window.UIHelpers.normalizeDigits === 'function') {
      text = window.UIHelpers.normalizeDigits(text);
    }
    var num = parseInt(text.replace(/[^\d-]/g, ''), 10);
    return isNaN(num) ? 0 : num;
  }

  // ارقام فارسی/عربی → ASCII
  function toAsciiDigits(text) {
    if (window.UIHelpers && typeof window.UIHelpers.normalizeDigits === 'function') {
      return window.UIHelpers.normalizeDigits(text);
    }
    return String(text)
      .replace(/[۰-۹]/g, function (d) { return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); })
      .replace(/[٠-٩]/g, function (d) { return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)); });
  }

  function hasPersianDigits(text) {
    return /[۰-۹٠-٩]/.test(String(text === null || text === undefined ? '' : text));
  }

  // ⚠️ نکتهٔ مهم: خروجی ``check_availability`` تاریخ ``end_date`` را به‌صورت
  // میلادی (ISO) برمی‌گرداند، ولی فیلد «تاریخ پایان» در فرم شمسی نمایش داده
  // می‌شود. پس باید تبدیل شود، وگرنه کاربر تاریخ میلادی می‌بیند.
  //
  // نکتهٔ دوم: ``jformat`` در قالب، ارقام را ASCII می‌نویسد (1405/03/24) ولی
  // persian-datepicker ارقام را فارسی می‌نویسد (۱۴۰۵/۰۳/۲۴). برای اینکه
  // «تاریخ پایان» با فیلدی که کاربر در آن تاریخ را وارد کرده یکدست بماند،
  // سبک ارقام را از همان فیلد شروع قرض می‌گیریم.
  function formatJalaliDate(value, referenceText) {
    if (!value) return '';

    var parsed = new Date(value);
    var result;

    if (isNaN(parsed.getTime())) {
      // اگر از قبل شمسی بود، فقط جداکننده را یکدست کن
      result = String(value).replace(/-/g, '/');
    } else {
      // Intl ارقام را فارسی تولید می‌کند
      result = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).format(parsed);
    }

    return hasPersianDigits(referenceText) ? result : toAsciiDigits(result);
  }

  function setAvailabilityState(form, state, message) {
    var box = form.querySelector('.js-availability-status');
    if (!box) return;

    box.classList.remove('d-none', 'alert-info', 'alert-success', 'alert-danger', 'alert-warning');

    if (!state) {
      box.classList.add('d-none');
      box.textContent = '';
      return;
    }

    var classMap = {
      checking: 'alert-info',
      available: 'alert-success',
      unavailable: 'alert-danger',
      warning: 'alert-warning',
    };
    box.classList.add(classMap[state] || 'alert-info');
    box.textContent = message || '';
  }

  function setSubmitDisabled(form, disabled) {
    form.querySelectorAll('button[type="submit"], input[type="submit"]').forEach(function (btn) {
      btn.disabled = !!disabled;
      btn.classList.toggle('disabled', !!disabled);
    });
  }

  function checkEditAvailability(form) {
    if (!form || !form.dataset.reservationId) return;

    var dressSelect = form.querySelector('select[name="dress"]');
    var startInput = form.querySelector('input[name="start_date"]');
    var daysInput = form.querySelector('input[name="rental_days"]');
    if (!dressSelect || !startInput || !daysInput) return;

    var dressId = dressSelect.value;
    var startDate = normalizeDateInput(startInput.value);
    var rentalDays = readNumber(daysInput.value);

    if (!dressId || !startDate || rentalDays < 1) {
      setAvailabilityState(
        form,
        'warning',
        'برای بررسی تداخل، لباس، تاریخ شروع و مدت اجاره باید کامل باشند.'
      );
      // ورودی ناقص تأییدنشده است؛ ذخیره قفل می‌ماند (اعتبارسنجی سرور هم محافظ است)
      setSubmitDisabled(form, true);
      return;
    }

    var statusBox = form.querySelector('.js-availability-status');
    var customerId = statusBox ? statusBox.dataset.customerId : '';

    var body = new URLSearchParams({
      dress_id: dressId,
      start_date: startDate,
      rental_days: String(rentalDays),
      exclude_reservation_id: form.dataset.reservationId,
    });
    if (customerId) body.append('customer_id', customerId);

    setAvailabilityState(form, 'checking', 'در حال بررسی موجودی…');
    setSubmitDisabled(form, true);

    fetch(AVAILABILITY_URL, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        'X-CSRFToken': (window.UIHelpers && window.UIHelpers.getCookie)
          ? window.UIHelpers.getCookie('csrftoken')
          : (document.cookie.match(/csrftoken=([^;]+)/) || [])[1],
        'X-Requested-With': 'XMLHttpRequest',
        'Accept': 'application/json',
      },
      body: body,
    })
      .then(function (response) { return response.json(); })
      .then(function (data) {
        if (!data || !data.success) {
          setAvailabilityState(form, 'warning', (data && data.message) || 'بررسی موجودی ممکن نشد.');
          setSubmitDisabled(form, false);
          return;
        }

        // به‌روزرسانی تاریخ پایان و تاریخ تحویل نمایشی (میلادی ISO → شمسی)
        var endDateInput = form.querySelector('input[id^="id_end_date_"]');
        if (endDateInput && data.end_date) {
          endDateInput.value = formatJalaliDate(data.end_date, startInput.value);
        }
        var deliveryDateInput = form.querySelector('input[id^="id_delivery_date_"]');
        if (deliveryDateInput && data.delivery_date) {
          deliveryDateInput.value = formatJalaliDate(data.delivery_date, startInput.value);
        }

        if (data.available) {
          setAvailabilityState(form, 'available', 'این لباس در بازهٔ انتخاب‌شده آزاد است.');
          setSubmitDisabled(form, false);
        } else {
          setAvailabilityState(
            form,
            'unavailable',
            'این لباس در این بازه قبلاً رزرو شده است. لطفاً تاریخ یا لباس دیگری انتخاب کنید.'
          );
          setSubmitDisabled(form, true);
        }
      })
      .catch(function () {
        setAvailabilityState(form, 'warning', 'ارتباط با سرور برقرار نشد؛ بررسی موجودی انجام نشد.');
        setSubmitDisabled(form, false);
      });
  }

  function scheduleAvailabilityCheck(form) {
    if (!form) return;
    var key = form.dataset.reservationId || 'default';
    if (availabilityTimers[key]) {
      clearTimeout(availabilityTimers[key]);
    }
    // کمی تأخیر تا تایپ/انتخاب کاربر تمام شود
    availabilityTimers[key] = setTimeout(function () {
      checkEditAvailability(form);
    }, 400);
  }

  function isAvailabilityTrigger(target) {
    if (!target || !target.name) return false;
    return ['start_date', 'rental_days', 'dress'].indexOf(target.name) !== -1;
  }

  ['change', 'input'].forEach(function (evtName) {
    document.addEventListener(evtName, function (event) {
      if (!isAvailabilityTrigger(event.target)) return;
      var form = event.target.closest('form[id^="reservationEditForm"]');
      if (!form) return;
      // تا وقتی بازهٔ جدید بررسی و تأیید نشده، ذخیرهٔ تغییرات قفل می‌ماند
      setSubmitDisabled(form, true);
      scheduleAvailabilityCheck(form);
    });
  });

  // دکمهٔ دستی «بررسی تداخل»: بررسی فوری بدون انتظار برای debounce
  document.addEventListener('click', function (event) {
    var btn = event.target.closest('.js-check-availability-btn');
    if (!btn) return;
    var form = btn.closest('form[id^="reservationEditForm"]');
    if (!form) return;
    var key = form.dataset.reservationId || 'default';
    if (availabilityTimers[key]) {
      clearTimeout(availabilityTimers[key]);
    }
    checkEditAvailability(form);
  });

  // هنگام باز شدن مودال، وضعیت اولیه پاک شود (نه هشدار کاذب)
  document.addEventListener('shown.bs.modal', function (event) {
    if (!event.target || !event.target.id || event.target.id.indexOf('editReservationModal') !== 0) return;
    var form = event.target.querySelector('form[id^="reservationEditForm"]');
    if (form) {
      setAvailabilityState(form, null, '');
      setSubmitDisabled(form, false);
    }
  });
})();
</script>
