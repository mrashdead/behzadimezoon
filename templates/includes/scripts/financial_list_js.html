<script>
document.addEventListener('DOMContentLoaded', function () {
  const financialModal = document.getElementById('financialModal');
  const financialFilters = document.getElementById('financialFilters');

  function buildFinancialQueryString() {
    const params = new URLSearchParams();
    const dateFrom = document.getElementById('dateFrom');
    const dateTo = document.getElementById('dateTo');
    const seller = document.getElementById('sellerSelect');

    if (dateFrom && dateFrom.value) {
      params.set('date_from', dateFrom.value);
    }
    if (dateTo && dateTo.value) {
      params.set('date_to', dateTo.value);
    }
    if (seller && seller.value) {
      params.set('seller', seller.value);
    }

    return params.toString();
  }

  if (financialFilters) {
    financialFilters.addEventListener('submit', function (event) {
      const dateFrom = document.getElementById('dateFrom');
      const dateTo = document.getElementById('dateTo');
      const seller = document.getElementById('sellerSelect');

      if (dateFrom) {
        dateFrom.value = dateFrom.value || '';
      }
      if (dateTo) {
        dateTo.value = dateTo.value || '';
      }
      if (seller && !seller.value) {
        seller.value = '';
      }
    });

    const exportBtn = document.getElementById('exportExcelBtn');
    if (exportBtn) {
      exportBtn.addEventListener('click', function (event) {
        if (exportBtn.disabled || exportBtn.getAttribute('aria-disabled') === 'true' || exportBtn.dataset.actionDisabled === 'true') {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          window.alert('موقتا غیر فعال');
          return;
        }
        event.preventDefault();
        const query = buildFinancialQueryString();
        const url = '{% url "financial:export_excel" %}' + (query ? `?${query}` : '');
        window.location.href = url;
      });
    }

    const clearFiltersBtn = document.getElementById('clearFiltersBtn');
    if (clearFiltersBtn) {
      clearFiltersBtn.addEventListener('click', function () {
        const dateFrom = document.getElementById('dateFrom');
        const dateTo = document.getElementById('dateTo');
        const seller = document.getElementById('sellerSelect');

        if (dateFrom) dateFrom.value = '';
        if (dateTo) dateTo.value = '';
        if (seller) seller.value = '';

        window.location.href = '{% url "financial:dashboard" %}';
      });
    }
  }

  if (window.flatpickr) {
    flatpickr('#dateFrom, #dateTo', {
      locale: 'fa',
      dateFormat: 'Y/m/d',
      altInput: false,
      allowInput: true,
      onChange: function (selectedDates, dateStr, instance) {
        if (instance.element) {
          instance.element.value = dateStr;
        }
      }
    });
  }

  if (financialModal) {
    financialModal.addEventListener('show.bs.modal', function () {
      this.setAttribute('aria-hidden', 'false');
    });
    financialModal.addEventListener('hide.bs.modal', function () {
      this.setAttribute('aria-hidden', 'true');
    });
    financialModal.addEventListener('hidden.bs.modal', function () {
      const body = document.getElementById('financialModalBody');
      if (body) {
        body.querySelectorAll('.modal').forEach(function (modalElement) {
          const instance = bootstrap.Modal.getInstance(modalElement);
          if (instance) {
            instance.dispose();
          }
          modalElement.remove();
        });
        const newBody = body.cloneNode(false);
        newBody.id = 'financialModalBody';
        newBody.innerHTML = '<div class="d-flex justify-content-center py-5"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>';
        body.parentNode.replaceChild(newBody, body);
      }

      document.querySelectorAll('.modal-backdrop').forEach(function (backdrop) {
        backdrop.remove();
      });
      document.body.classList.remove('modal-open');
      document.body.style.overflow = '';
    });
  }
});
</script>
